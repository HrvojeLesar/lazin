[package]
name = "lazin"
version = "1.0.4"
edition = "2024"
authors = ["Hrvoje Lesar <hrvoje.lesar1@hotmail.com>"]
description = "Primarily a dotfiles manager"
license = "MIT"
repository = "https://github.com/HrvojeLesar/lazin"
keywords = ["decryption", "dotfiles", "encryption", "file-linking", "manager"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.1", features = ["cargo", "derive"] }
codespan-reporting = "0.13.1"
lazin_error = { path = "../lazin_error", version = "0.1.1" }
lazin_gpg_wrapper = { path = "../lazin_gpg_wrapper", version = "0.1.0" }
lazin_logger = { path = "../lazin_logger", version = "0.2.0" }
lazin_pipeline = { path = "../lazin_pipeline", version = "0.1.0" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
sha2 = "=0.10.9"
toml = "1.1.2"

[dev-dependencies]
lazin_test_macros = { path = "../lazin_test_macros", version = "0.1.0" }
lazin_test_utils = { path = "../lazin_test_utils", version = "0.1.0" }
